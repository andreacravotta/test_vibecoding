<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Mentale Interattiva</title>
    <!-- Importiamo la libreria D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; /* Sfondo scuro simile all'immagine */
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita scrollbar iniziali */
        }
        #mindmap {
            width: 100vw;
            height: 100vh;
        }
        .node circle {
            fill: #238636; /* Colore verde per i nodi chiusi */
            stroke: #2ea043;
            stroke-width: 2px;
            cursor: pointer;
        }
        .node text {
            font-size: 12px;
            fill: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        /* Stile per i rettangoli di sfondo del testo */
        .node rect {
            fill: #1f2937;
            stroke: #374151;
            stroke-width: 1.5px;
            rx: 6; /* Bordi arrotondati */
            ry: 6;
        }
        .link {
            fill: none;
            stroke: #4b5563; /* Colore delle linee di collegamento */
            stroke-width: 1.5px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div id="mindmap"></div>

    <script>
        // Struttura dati estratta dal file "NotebookLM Mind Map.jpg"
        const treeData = {
            name: "Progetto Inclusione: Percorsi di Crescita e Impresa Sociale",
            children: [
                {
                    name: "Quale - Quadro EntreComp",
                    children: [
                        {
                            name: "Definizione",
                            children: [
                                { name: "Azioni in apprendimento reale" },
                                { name: "Creare valore per gli altri" },
                                { name: "Riconoscere le sfide e le direzioni" }
                            ]
                        },
                        {
                            name: "Caratteristiche",
                            children: [
                                { name: "Competenza chiave trasversale" },
                                { name: "Apprendibile e migliorabile" },
                                { name: "Attraverso la pratica" }
                            ]
                        },
                        {
                            name: "Struttura del Quadro",
                            children: [
                                { name: "Idee e Opportunità (3)" },
                                { name: "Risorse e Asset (3)" },
                                { name: "In Azione (3)" }
                            ]
                        }
                    ]
                },
                {
                    name: "4. Le Competenze Chiave",
                    children: [
                        {
                            name: "Area Idee e Opportunità",
                            children: [
                                { name: "Scoprire i bisogni del PT" },
                                { name: "Generazione di nuove idee" },
                                { name: "Visione del futuro" },
                                { name: "Due - sola - relazionale" },
                                { name: "Principi etici e di sostenibilità" }
                            ]
                        },
                        {
                            name: "Area Risorse",
                            children: [
                                { name: "Autoconsapevolezza ed Efficacia" },
                                { name: "Motivazione e perseveranza" },
                                { name: "Mobilitare risorse umane e mater..." },
                                { name: "Conoscenze economico - finanziarie" },
                                { name: "Mobilitare e coinvolgere gli altri" }
                            ]
                        },
                        {
                            name: "Area in Azione",
                            children: [
                                { name: "Iniziativa Personale" },
                                { name: "Pianificaz. ed organizzazione" },
                                { name: "Gestire incertezza, rischio" },
                                { name: "Lavorare con gli altri" },
                                { name: "Imparare dall'esperienza" }
                            ]
                        }
                    ]
                },
                {
                    name: "Struttura del Modello (Fasi e Azioni)",
                    children: [
                        {
                            name: "Fase 1: Mappatura delle Competenze",
                            children: [
                                { name: "Fase 1: Assessment ex ante/ex post" },
                                { name: "Criteri di efficacia e misurazione" },
                                { name: "Fase 1: Autovalutazione con ex aequo" },
                                { name: "Analisi dei 4 step macro-referenziali" },
                                { name: "Schede di valutazione destrutturate" }
                            ]
                        },
                        {
                            name: "Fase 2: Sperimentazione in Azione",
                            children: [
                                { name: "Fase 2a: Ricerca di opportunità nel..." },
                                { name: "Modulo 1: Analisi del Contesto" },
                                { name: "Fase 2b: Ruoli e Leadership per il Pro..." },
                                { name: "Monitoraggio in itinere" },
                                { name: "Fase 2c: Sviluppo del Business Concept" },
                                { name: "Pitch e Business Plan - Sostenibilità" }
                            ]
                        }
                    ]
                },
                {
                    name: "Metodologia e Strumenti",
                    children: [
                        { name: "Approccio pratico/learning-by-doing" },
                        { name: "Valutazione di competenze non formali" },
                        { name: "Tool: Log Design Orizzonti / EntreComp" },
                        { name: "Piattaforme WEB e percorsi gamification" },
                        { name: "Simulazioni e case history in realtà" }
                    ]
                }
            ]
        };

        // Dimensioni e margini
        const margin = {top: 20, right: 120, bottom: 20, left: 250},
            width = 1600 - margin.right - margin.left,
            height = 1000 - margin.top - margin.bottom;

        // Crea il contenitore SVG con supporto allo zoom e pan
        const svg = d3.select("#mindmap").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .call(d3.zoom().on("zoom", function (event) {
                svgGroup.attr("transform", event.transform)
            }))
            .append("g")
            .attr("transform", "translate("
                + margin.left + "," + (margin.top + height/2) + ")"); // Centrato verticalmente all'inizio

        const svgGroup = svg;

        // Dichiara il layout ad albero
        const treemap = d3.tree().size([height, width]);

        // Assegna il nodo radice
        let root = d3.hierarchy(treeData, function(d) { return d.children; });
        root.x0 = height / 2;
        root.y0 = 0;

        // Collassa l'albero inizialmente eccetto il primo livello (opzionale)
        // Se vuoi che parta tutto aperto, commenta la funzione 'collapse' qui sotto.
        function collapse(d) {
            if(d.children) {
                d._children = d.children
                d._children.forEach(collapse)
                d.children = null
            }
        }
        // Decommenta la riga sotto se vuoi che i rami secondari partano chiusi
        // root.children.forEach(collapse);

        update(root);

        // Funzione principale di aggiornamento
        function update(source) {
            const treeData = treemap(root);
            const nodes = treeData.descendants(),
                  links = treeData.descendants().slice(1);

            // Normalizza la profondità (spazio orizzontale tra i nodi)
            nodes.forEach(function(d){ d.y = d.depth * 250});

            // ****************** Nodi ***************************
            const node = svgGroup.selectAll('g.node')
                .data(nodes, function(d) { return d.id || (d.id = ++i); });

            let i = 0;

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", function(d) {
                    return "translate(" + source.y0 + "," + source.x0 + ")";
                })
                .on('click', click);

            // Aggiunge i cerchi (nodi cliccabili)
            nodeEnter.append('circle')
                .attr('class', 'node')
                .attr('r', 1e-6)
                .style("fill", function(d) {
                    return d._children ? "#2ea043" : "#1f2937"; 
                });

            // Calcolo larghezza sfondo testo per simulare l'effetto "pillola"
            nodeEnter.append("rect")
                .attr("y", -12)
                .attr("x", function(d) { return d.children || d._children ? -13 : 13; })
                .attr("height", 24)
                .style("fill", function(d) { return d.depth === 0 ? "#1f6feb" : (d.depth === 1 ? "#3b82f6" : "#0d9488"); }) // Colori basati sull'immagine
                .style("fill-opacity", 0.3)
                .style("stroke-opacity", 0.8)
                .attr("width", 1); // Aggiornato dopo l'inserimento del testo

            // Aggiunge i testi
            const textNodes = nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", function(d) {
                    return d.children || d._children ? -20 : 20;
                })
                .attr("text-anchor", function(d) {
                    return d.children || d._children ? "end" : "start";
                })
                .text(function(d) { return d.data.name; });

            // Adatta lo sfondo del rettangolo in base alla lunghezza del testo
            textNodes.each(function(d) {
                const bbox = this.getBBox();
                d.bbox = bbox;
            });

            nodeEnter.selectAll("rect")
                .attr("width", function(d) { return d.bbox.width + 16; })
                .attr("x", function(d) { 
                    return d.children || d._children ? d.bbox.x - 8 : 12; 
                });


            const nodeUpdate = nodeEnter.merge(node);

            // Transizione all'apertura
            nodeUpdate.transition()
                .duration(500)
                .attr("transform", function(d) { 
                    return "translate(" + d.y + "," + d.x + ")";
                });

            // Aggiorna lo stile dei cerchi a seconda se sono aperti o chiusi
            nodeUpdate.select('circle.node')
                .attr('r', 8)
                .style("fill", function(d) {
                    return d._children ? "#2ea043" : "#1f2937";
                })
                .attr('cursor', 'pointer');


            // Transizione alla chiusura
            const nodeExit = node.exit().transition()
                .duration(500)
                .attr("transform", function(d) {
                    return "translate(" + source.y + "," + source.x + ")";
                })
                .remove();

            nodeExit.select('circle')
                .attr('r', 1e-6);

            nodeExit.select('text')
                .style('fill-opacity', 1e-6);

            // ****************** Linee di collegamento (Links) ***************************
            const link = svgGroup.selectAll('path.link')
                .data(links, function(d) { return d.id; });

            // Generatore delle curve SVG
            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', function(d){
                    const o = {x: source.x0, y: source.y0}
                    return diagonal(o, o)
                });

            const linkUpdate = linkEnter.merge(link);

            linkUpdate.transition()
                .duration(500)
                .attr('d', function(d){ return diagonal(d, d.parent) });

            const linkExit = link.exit().transition()
                .duration(500)
                .attr('d', function(d) {
                    const o = {x: source.x, y: source.y}
                    return diagonal(o, o)
                })
                .remove();

            // Memorizza le vecchie posizioni per la transizione
            nodes.forEach(function(d){
                d.x0 = d.x;
                d.y0 = d.y;
            });

            // Funzione per disegnare le linee curve (Bezier)
            function diagonal(s, d) {
                const path = `M ${s.y} ${s.x}
                        C ${(s.y + d.y) / 2} ${s.x},
                          ${(s.y + d.y) / 2} ${d.x},
                          ${d.y} ${d.x}`
                return path
            }

            // Attiva e disattiva il collasso al click (toggle children)
            function click(event, d) {
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                } else {
                    d.children = d._children;
                    d._children = null;
                }
                update(d);
            }
        }
    </script>
</body>
</html>
