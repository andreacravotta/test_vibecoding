<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Mentale Interattiva</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
        }
        
        /* Stili della Sidebar Laterale Fissa */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background-color: #0f1523;
            border-right: 1px solid #1f293d;
            padding: 24px 16px;
            z-index: 9999;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .sidebar-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1f293d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tree-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .tree-menu li {
            margin-bottom: 6px;
        }
        .tree-menu a, .tree-menu span.folder {
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            cursor: default;
        }
        .tree-menu a {
            cursor: pointer;
        }
        .tree-menu a:hover {
            background-color: #1f293d;
            color: #ffffff;
        }
        .tree-menu a.active {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }
        .tree-menu ul {
            list-style: none;
            padding-left: 16px;
            margin-top: 4px;
            margin-left: 12px;
            border-left: 1px solid #374151;
        }

        
        #mindmap {
            margin-left: 260px;
            width: calc(100vw - 260px);
            height: 100vh;
            cursor: grab;
        }
        #mindmap:active { cursor: grabbing; }
        
        /* Controlli rapidi traslati per fare spazio alla sidebar */
        .controls {
            position: absolute;
            top: 16px;
            left: 276px; /* 260 della sidebar + 16 di margine */
            z-index: 10;
            display: flex;
            gap: 8px;
        }
        .controls button {
            background: #1f293d; color: #e5e7eb; border: 1px solid #374151; padding: 8px 14px;
            border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s ease;
        }
        .controls button:hover { background: #374151; color: #ffffff; }
        
        /* Stili dei Nodi D3 */
        .node { cursor: pointer; }
        .node rect { stroke-width: 1.5px; rx: 12; ry: 12; transition: filter 0.2s; }
        .node:hover rect { filter: brightness(1.25); }
        .node text { font-size: 13px; font-weight: 500; fill: #ffffff; pointer-events: none; dominant-baseline: central; }
        .toggle-circle { fill: #ffffff; stroke-width: 2px; }
        .link { fill: none; stroke: #475569; stroke-width: 1.8px; opacity: 0.7; }
    </style>
</head>
<body>
    
    <nav class="sidebar">
        <div class="sidebar-title">🧭 Navigazione</div>
        <ul class="tree-menu">
            <li><a href="index.html" >🏠 Home Progetto</a></li>
            <li>
                <span class="folder">📂 Esplora Risorse</span>
                <ul>
                    <li><a href="mappa.html" class="active">🌿 Mappa Interattiva</a></li>
                    <li><a href="linkutili.html" >📚 Link Utili</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    

    <div class="controls">
        <button onclick="expandAll()">Espandi Tutto</button>
        <button onclick="collapseAll()">Comprimi Tutto</button>
        <button onclick="resetZoom()">Centra Vista</button>
    </div>

    <div id="mindmap"></div>

    <script>
        const treeData = {
            name: "Progetto Inclusione: Percorsi di Crescita e Impresa Sociale",
            children: [
                {
                    name: "Quale - Quadro EntreComp",
                    children: [
                        { name: "Definizione", children: [ { name: "Azioni in apprendimento reale" }, { name: "Creare valore per gli altri" }, { name: "Riconoscere le sfide e le direzioni" } ] },
                        { name: "Caratteristiche", children: [ { name: "Competenza chiave trasversale" }, { name: "Apprendibile e migliorabile" }, { name: "Attraverso la pratica" } ] },
                        { name: "Struttura del Quadro", children: [ { name: "Idee e Opportunità (3)" }, { name: "Risorse e Asset (3)" }, { name: "In Azione (3)" } ] }
                    ]
                },
                {
                    name: "4. Le Competenze Chiave",
                    children: [
                        { name: "Area Idee e Opportunità", children: [ { name: "Scoprire i bisogni del PT" }, { name: "Generazione di nuove idee" }, { name: "Visione del futuro" }, { name: "Due - sola - relazionale" }, { name: "Principi etici e di sostenibilità" } ] },
                        { name: "Area Risorse", children: [ { name: "Autoconsapevolezza ed Efficacia" }, { name: "Motivazione e perseveranza" }, { name: "Mobilitare risorse umane e mater..." }, { name: "Conoscenze economico - finanziarie" }, { name: "Mobilitare e coinvolgere gli altri" } ] },
                        { name: "Area in Azione", children: [ { name: "Iniziativa Personale" }, { name: "Pianificaz. ed organizzazione" }, { name: "Gestire incertezza, rischio" }, { name: "Lavorare con gli altri" }, { name: "Imparare dall'esperienza" } ] }
                    ]
                },
                {
                    name: "Struttura del Modello (Fasi e Azioni)",
                    children: [
                        { name: "Fase 1: Mappatura delle Competenze", children: [ { name: "Fase 1: Assessment ex ante/ex post" }, { name: "Criteri di efficacia e misurazione" }, { name: "Fase 1: Autovalutazione con ex aequo" }, { name: "Analisi dei 4 step macro-referenziali" }, { name: "Schede di valutazione destrutturate" } ] },
                        { name: "Fase 2: Sperimentazione in Azione", children: [ { name: "Fase 2a: Ricerca di opportunità nel..." }, { name: "Modulo 1: Analisi del Contesto" }, { name: "Fase 2b: Ruoli e Leadership per il Pro..." }, { name: "Monitoraggio in itinere" }, { name: "Fase 2c: Sviluppo del Business Concept" }, { name: "Pitch e Business Plan - Sostenibilità" } ] }
                    ]
                },
                {
                    name: "Metodologia e Strumenti",
                    children: [
                        { name: "Approccio pratico/learning-by-doing" },
                        { name: "Valutazione di competenze non formali" },
                        { name: "Tool: Log Design Orizzonti / EntreComp" },
                        { name: "Piattaforme WEB e percorsi gamification" },
                        { name: "Simulazioni e case history in realtà" }
                    ]
                }
            ]
        };

        const container = document.getElementById("mindmap");
        const width = container.clientWidth;
        const height = container.clientHeight;

        const svg = d3.select("#mindmap").append("svg")
            .attr("width", "100%")
            .attr("height", "100%");

        const g = svg.append("g");

        const zoom = d3.zoom().scaleExtent([0.3, 3]).on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);

        const tree = d3.tree().nodeSize([45, 280]).separation((a, b) => (a.parent === b.parent ? 1 : 1.2));
        let idCounter = 0;
        const root = d3.hierarchy(treeData, d => d.children);
        root.x0 = height / 2; root.y0 = 0;

        const colors = [
            { bg: "#3b2866", stroke: "#8b5cf6" },
            { bg: "#1e3a5f", stroke: "#38bdf8" },
            { bg: "#064e3b", stroke: "#34d399" },
            { bg: "#134e4a", stroke: "#2dd4bf" }
        ];
        function getNodeColor(depth) { return colors[Math.min(depth, colors.length - 1)]; }

        update(root);
        resetZoom();

        function update(source) {
            const treeLayout = tree(root);
            const nodes = treeLayout.descendants();
            const links = treeLayout.links();

            nodes.forEach(d => { d.y = d.depth * 280; });

            const node = g.selectAll('g.node').data(nodes, d => d.id || (d.id = ++idCounter));
            const nodeEnter = node.enter().append('g').attr('class', 'node')
                .attr('transform', d => `translate(${source.y0},${source.x0})`)
                .on('click', (event, d) => {
                    if (d.children) { d._children = d.children; d.children = null; }
                    else if (d._children) { d.children = d._children; d._children = null; }
                    update(d);
                });

            nodeEnter.append('rect').attr('height', 30).attr('y', -15).attr('fill', d => getNodeColor(d.depth).bg).attr('stroke', d => getNodeColor(d.depth).stroke);
            nodeEnter.append('text').attr('x', 14).attr('y', 0).text(d => d.data.name);
            nodeEnter.append('circle').attr('class', 'toggle-circle').attr('r', 5).attr('cy', 0);

            nodeEnter.each(function(d) {
                const textElem = d3.select(this).select('text').node();
                const textWidth = textElem.getComputedTextLength();
                d.boxWidth = textWidth + 30;
                d3.select(this).select('rect').attr('width', d.boxWidth);
                d3.select(this).select('.toggle-circle').attr('cx', d.boxWidth).attr('stroke', getNodeColor(d.depth).stroke).style('display', (d.children || d._children) ? 'block' : 'none');
            });

            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition().duration(350).attr('transform', d => `translate(${d.y},${d.x})`);
            nodeUpdate.select('.toggle-circle').style('display', d => (d.children || d._children) ? 'block' : 'none').attr('fill', d => d._children ? getNodeColor(d.depth).stroke : '#ffffff');

            const nodeExit = node.exit().transition().duration(350).attr('transform', d => `translate(${source.y},${source.x})`).remove();
            nodeExit.select('rect').attr('width', 0); nodeExit.select('text').style('fill-opacity', 0);

            const link = g.selectAll('path.link').data(links, d => d.target.id);
            const linkEnter = link.enter().insert('path', 'g').attr('class', 'link').attr('d', d => { const o = { x: source.x0, y: source.y0 + (source.boxWidth || 0) }; return diagonal(o, o); });
            linkEnter.merge(link).transition().duration(350).attr('d', d => { const start = { x: d.source.x, y: d.source.y + d.source.boxWidth }; const end = { x: d.target.x, y: d.target.y }; return diagonal(start, end); });
            link.exit().transition().duration(350).attr('d', d => { const o = { x: source.x, y: source.y + (source.boxWidth || 0) }; return diagonal(o, o); }).remove();

            nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
        }

        function diagonal(s, d) { return `M ${s.y} ${s.x} C ${(s.y + d.y) / 2} ${s.x}, ${(s.y + d.y) / 2} ${d.x}, ${d.y} ${d.x}`; }
        function collapse(d) { if (d.children) { d._children = d.children; d._children.forEach(collapse); d.children = null; } }
        function expand(d) { if (d._children) { d.children = d._children; d.children.forEach(expand); d._children = null; } else if (d.children) { d.children.forEach(expand); } }
        function collapseAll() { if (root.children) { root.children.forEach(collapse); update(root); resetZoom(); } }
        function expandAll() { expand(root); update(root); }
        function resetZoom() { svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(80, height / 2).scale(0.85)); }
        window.addEventListener('resize', () => { resetZoom(); });
    </script>
</body>
</html>
